name: Deploy Semáforo Inteligente

on:
  push:
    branches:
      - main
    paths:
      - 'semaforo-inteligente/frontend/**'
      - '.github/workflows/deploy-pages.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: semaforo-inteligente/frontend

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: semaforo-inteligente/frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Compilar aplicação
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos compilados
        uses: actions/upload-pages-artifact@v4
        with:
          path: semaforo-inteligente/frontend/dist

  deploy:
    name: Publicar Dashboard
    runs-on: ubuntu-latest

    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4